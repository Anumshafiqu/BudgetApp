<div class="container">
  <!-- Header Row -->
  <div class="row mt-4">
    <div class="col-6">
      <h4>Income</h4>
    </div>
    <div class="col-6 text-end">
      <button class="btn btn-primary" (click)="openmodel()">Add New</button>
    </div>
  </div>

  <!-- Cards Row -->
  <div class="row mt-4">
    <div class="col-lg-3">
      <div class="card bg-info border-0 mt-3">
        <div class="card-body">
          <h4 class="card-title text-white">CategoryName</h4>
          <p class="card-text text-white">$329420</p>
          <p class="card-text text-white">Purpose</p>
          <a href="#" class="card-link text-primary">Edit</a>
          <a href="#" class="card-link text-danger">Delete</a>
        </div>
      </div>
    </div>
      <div class="col-lg-3" *ngFor="let item of CategoryList">
      <div class="card bg-info border-0 mt-3">
        <div class="card-body">
          <h4 class="card-title text-white">{{ item.categoryName }}</h4>
          <p class="card-text text-white">${{ item.amount }}</p>
          <p class="card-text text-white">{{ item.purpose }}</p>
          <a href="#" class="card-link text-primary" (click)="editTransaction(item)">Edit</a>
          <a href="#" class="card-link text-danger" (click)="deleteTransaction(item.categoryId)">Delete</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="myModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title">Add Transaction</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">
        <form #transactionForm="ngForm">
          <div class="mb-3">
            <label for="amount" class="form-label">Amount</label>
            <input
              type="number"
              class="form-control"
              id="amount"
              [(ngModel)]="transctionObj.amount"
              name="amount"
              placeholder="Enter amount"
              required
            />
          </div>

          <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select
              class="form-select"
              [(ngModel)]="transctionObj.categoryId"
              name="categoryId"
              required
            >
              <option value="">Select Category</option>
              <option *ngFor="let item of CategoryList" [value]="item.categoryId">
                {{ item.categoryName }}
              </option>
            </select>
          </div>

          <div class="mb-3">
            <label for="purpose" class="form-label">Purpose</label>
            <textarea
              class="form-control"
              id="purpose"
              [(ngModel)]="transctionObj.purpose"
              name="purpose"
              rows="3"
              placeholder="Enter purpose"
              required
            ></textarea>
          </div>
        </form>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="saveTransaction()">Save</button>
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
