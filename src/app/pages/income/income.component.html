  <div class="container">
    <div class="row mt-4">
      <div class="col-6">
        <h4>Income</h4>
      </div>
      <div class="col-6">
        <button class="btn btn-primary" (click)="openmodel()">Add new</button>
      </div>
    </div>
  
    <div class="row mt-4">
      <div class="col-lg-3" *ngFor="let item of CategoryList">
        <div class="card bg-info border-0 mt-3">
          <div class="card-body">
            <h4 class="card-title text-white">Card</h4>
            <p class="card-text text-white">$34000</p>
            <a href="#" class="card-link text-primary">Edit</a>
            <a href="#" class="card-link text-danger">Delete</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Modal -->
  <div class="modal" id="myModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <!-- Modal Header -->
        <div class="modal-header">
          <h4 class="modal-title">Add Transaction</h4>
          <button type="button" class="btn-close" (click)="closemodel()"></button>
        </div>
  
        <!-- Modal Body -->
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="amount" class="form-label">Amount</label>
              <input
                type="number"
                class="form-control"
                id="amount"
                [(ngModel)]="transctionObj.amount"
                name="amount"
                placeholder="Enter amount"
                required
              />
            </div>
  
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select
                class="form-select"
                [(ngModel)]="transctionObj.categoryId"
                name="categoryId"
                required
              >
                <option *ngFor="let item of CategoryList" [value]="item.categoryId">
                  {{ item.categoryName }}
                </option> 
                <!-- <option value="">category</option>
                <option value="">category-1</option>
                <option value="">category-1</option> -->

              </select>
            </div>
  
            <div class="mb-3">
              <label for="purpose" class="form-label">Purpose</label>
              <textarea
                class="form-control"
                id="purpose"
                [(ngModel)]="transctionObj.purpose"
                name="purpose"
                rows="3"
                placeholder="Enter purpose"
                required
              ></textarea>
            </div>
          </form>
        </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" (click)="saveData()">Save</button>
            <button type="button" class="btn btn-danger" (click)="closemodel()">Close</button>
          </div>
      </div>
    </div>
  </div>
